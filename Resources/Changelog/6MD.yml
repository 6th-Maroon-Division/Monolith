- author: chilla55
  changes:
    - type: Fix
      message: >-
        Added ResyncGridDeviceNetwork(EntityUid gridUid) to DeviceNetworkSystem.
        It walks every DeviceNetworkComponent on the grid, reapplies frequency
        values from their ID prototypes if null, and calls ConnectDevice() to
        register them back into the network. This is called in
        ShipyardSystem.Consoles.cs after a ship is retrieved and in
        PersistenceAnchorSystem.HealRestoredSnapshots() after a persistence
        restore — mirroring the existing ResyncGridGravity pattern.
    - type: Fix
      message: >-
        Signal-linked devices (blast doors, switches, linked machines) on ships
        now correctly reconnect after shipyard retrieval or persistence restore.
  id: 10
  time: '2026-04-13T05:11:40.0000000+00:00'
